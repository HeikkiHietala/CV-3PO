<VirtualHost *:80>
    ServerName cv3po.local
    DocumentRoot /var/www/cv3po

    <Directory /var/www/cv3po>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cv3po-error.log
    CustomLog ${APACHE_LOG_DIR}/cv3po-access.log combined
</VirtualHost>
